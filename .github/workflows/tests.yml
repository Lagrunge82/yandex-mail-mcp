name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --locked --no-sync --python ${{ matrix.python-version }} pytest -q --cov=yandex_mail_mcp --cov-fail-under=75

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-extras --python 3.13
      - run: uv run --locked --no-sync ruff check .
      - run: uv run --locked --no-sync ruff format --check .
      - run: uv run --locked --no-sync mypy src
      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --all-extras --no-dev --no-emit-project --no-hashes --quiet > /tmp/runtime-requirements.txt
          uv run --locked --no-sync pip-audit --disable-pip --no-deps -r /tmp/runtime-requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t yandex-mail-mcp:test .

  version:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [tests, quality, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.version.outputs.bumped }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        if: github.ref == 'refs/heads/main'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: github.ref == 'refs/heads/main'
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        if: github.ref == 'refs/heads/main'
      - name: Install version comparison dependency
        if: github.ref == 'refs/heads/main'
        run: uv sync --locked --no-install-project --python 3.13
      - name: Compare project versions
        if: github.ref == 'refs/heads/main'
        id: version
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: uv run --locked --no-sync python .github/scripts/version_change.py
      - name: Create version tag
        if: github.ref == 'refs/heads/main' && steps.version.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            existing=$(git rev-parse "refs/tags/$tag^{commit}")
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Tag $tag already points to a different commit" >&2
              exit 1
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Determine image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=v${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.bumped == 'true' }}
            type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build and publish
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record immutable image reference
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf '### Published image\n\n`%s@%s`\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
