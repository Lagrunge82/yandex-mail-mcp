services:
  # Local HTTP MCP endpoint. The host port is NOT exposed publicly.
  mcp:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      # The published port is restricted to localhost on the host machine.
      MCP_ALLOW_UNAUTHENTICATED_REMOTE: "${MCP_ALLOW_UNAUTHENTICATED_REMOTE:-false}"
    ports:
      - "127.0.0.1:8000:8000"
